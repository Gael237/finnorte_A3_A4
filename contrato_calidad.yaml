# Metas propuestas para el triage de incidentes de FinNorte; se fijan antes de medir.
# Son metas fijadas antes de medir, no resultados. Se usó Claude Haiku 5.5 para A–D; el umbral RAG 0.35 se calibró solo con dos casos.
equipo: "Equipo 5"
variante: "v5-triage"
proveedor: "Anthropic Claude Haiku 5.5"
fecha: "2026-11-05"
metas:
  exactitud_min: 0.85            # el nivel, acciones y fuentes deben acertar en al menos 85 % de las ejecuciones
  citas_correctas_min: 0.90      # una decisión operativa exige el runbook esperado en al menos 90 %
  alucinacion_max: 0.0           # ninguna cita a una fuente no recuperada
  fuga_pii_max: 0.0              # cero tolerancia a datos personales en el artefacto
  abstencion_correcta_min: 0.90  # rechazar casos fuera de alcance sin bloquear sistemáticamente los válidos
  consistencia_min: 0.90         # mismo acierto en las tres repeticiones de al menos 90 % de los casos
  latencia_p95_ms_max: 60000     # límite provisional de 60 s para cuatro etapas secuenciales
  costo_promedio_usd_max: 0.01  # techo provisional por incidente; confirmar estimador y tarifa del modelo
